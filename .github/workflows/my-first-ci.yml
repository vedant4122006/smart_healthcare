name: Smart Healthcare Central CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: TEST, LINT & SECURITY AUDIT
  # ==========================================
  test-and-audit:
    name: 1. Test & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies & Audit Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff bandit

      - name: Check Python Syntax
        run: |
          python -m compileall -q app.py seed_admin.py services models
          echo "Syntax check passed."

      - name: Check Critical Code Errors (Ruff)
        run: |
          # Checks only for real runtime-breaking errors (undefined variables, syntax, broken imports)
          ruff check app.py seed_admin.py services models --select=E9,F63,F7,F82

      - name: Run Security Scan (Bandit)
        run: |
          # Scans for HIGH severity security vulnerabilities in Python code
          bandit -r app.py seed_admin.py services models -ll

      - name: Run Automated Pytest Suite
        run: |
          pytest -v --tb=short

      - name: Write Test Report to GitHub Summary
        if: always()
        run: |
          echo "### Job 1: Code Quality & Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit Tested:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Job Status:** **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # JOB 2: BUILD & PUSH TO DOCKER HUB
  # ==========================================
  push-to-dockerhub:
    name: 2. Build & Push Docker Hub
    needs: test-and-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-healthcare:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-healthcare:${{ github.sha }}

      - name: Scan Built Image for Critical Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/smart-healthcare:latest
          format: table
          severity: CRITICAL
          # exit-code 0 prints the full table in your logs without breaking deploys over upstream OS patches
          exit-code: "0"
          ignore-unfixed: true

      - name: Write Docker Report to GitHub Summary
        if: always()
        run: |
          echo "### Job 2: Docker Hub Release" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Pushed:** \`${{ secrets.DOCKERHUB_USERNAME }}/smart-healthcare:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Job Status:** **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # JOB 3: DEPLOY TO RENDER & VERIFY LIVE URL
  # ==========================================
  deploy-to-render:
    name: 3. Deploy to Render & Verify
    needs: push-to-dockerhub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Render Deployment Webhook
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Render deploy webhook triggered."

      - name: Wait for Render Container Rollout & Verify /health
        run: |
          echo "Waiting 30s for Render to start building/rolling out..."
          sleep 30
          curl --fail --show-error \
            --retry 15 \
            --retry-delay 10 \
            --retry-all-errors \
            https://smart-healthcare-is62.onrender.com/health
          echo "Live health check passed!"

      - name: Write Deployment Report to GitHub Summary
        if: always()
        run: |
          echo "### Job 3: Production Render Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL:** https://smart-healthcare-is62.onrender.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check:** \`/health\` verified" >> $GITHUB_STEP_SUMMARY
          echo "- **Job Status:** **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY
