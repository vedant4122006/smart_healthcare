name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Say Hello
        run: echo "Hello! The CI script is running successfully."

      - name: Look at project files
        run: ls -la

      - name: Simulate Tests
        run: |
          echo "Running application tests..."
          echo "All tests passed successfully!"

  deploy-to-render:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render CD Pipeline
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

